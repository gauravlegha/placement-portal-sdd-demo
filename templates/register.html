<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <div class="container">
        <div class="row justify-content-center" style="margin-top: 50px; margin-bottom: 50px;">
            <div class="col-md-6">
                
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <strong>Notice:</strong> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <div class="card shadow-lg border-0" style="border-radius: 1rem; overflow: hidden;">
                    <div class="card-header text-white text-center py-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-bottom: none;">
                        <h3 class="mb-0 fw-bold">Create an Account</h3>
                        <p class="mb-0 small text-light">Join the Placement Portal today</p>
                    </div>
                    
                    <div class="card-body p-5 bg-white">
                        <form method="POST" action="/register">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Username</label>
                                <input type="text" name="username" class="form-control form-control-lg bg-light" placeholder="Choose a username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg bg-light" placeholder="Min. 6 characters" minlength="6" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary">I am registering as a:</label>
                                <select name="role" class="form-select form-select-lg bg-light" required>
                                    <option value="" disabled selected>Select your role...</option>
                                    <option value="student">Student</option>
                                    <option value="company">Company</option>
                                </select>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold" style="background: #667eea; border: none;">Register Now</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted">Already have an account? <a href="/login" class="text-decoration-none fw-bold" style="color: #764ba2;">Login here</a></p>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
