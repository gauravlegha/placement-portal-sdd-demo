{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Edit Profile</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/edit_profile" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Education (Degree / University)</label>
                        <input type="text" name="education" class="form-control" value="{{ student.education or '' }}" placeholder="e.g., B.Tech Computer Science">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Skills</label>
                        <input type="text" name="skills" class="form-control" value="{{ student.skills or '' }}" placeholder="e.g., Python, Flask, HTML, CSS">
                    </div>

                    <div class="mb-4 p-3 bg-light border rounded">
                        <label class="form-label fw-bold">Update Resume</label>
                        {% if student.resume %}
                            <p class="small text-success mb-2">Current Resume: {{ student.resume }}</p>
                        {% endif %}
                        <input type="file" name="resume" class="form-control form-control-sm" accept=".pdf,.doc,.docx">
                        <small class="text-muted">Leave blank to keep your current resume.</small>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">Save Profile</button>
                        <a href="/student_dashboard" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
